[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# The tap the formula is written for. dist warns that its own Homebrew publish
# job is off: publish-homebrew.yml pushes the formula from the `release`
# environment instead, so it ships only after the approval.
tap = "mahkassem/homebrew-tap"
npm-shrinkwrap = false
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Publish to npm, crates.io and the Homebrew tap through the publish-*.yml
# workflows, each in the approval-gated `release` environment
publish-jobs = ["./publish-npm", "./publish-crates", "./publish-homebrew"]
plan-jobs = ["./docs-check"]
# Attest every build artifact with GitHub's build provenance
github-attestations = true
# Plan (don't build) on pull requests
pr-run-mode = "plan"

[dist.github-action-commits]
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
"actions/setup-node" = "949feb2413d6458794dcd2491c4babbbce0c15c1"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
