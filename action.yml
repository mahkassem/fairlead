name: Fairlead
description: Install Fairlead and run one of its commands.
branding:
  icon: anchor
  color: blue
inputs:
  command:
    description: The fairlead arguments to run, for example `doctor` or `ci plan`.
    required: false
    default: doctor
  version:
    description: A release tag such as v0.1.0, or `latest`.
    required: false
    default: latest
outputs:
  all:
    description: "`ci plan --format github`: true when everything is selected."
    value: ${{ steps.run.outputs.all }}
  plan:
    description: "`ci plan --format github`: the path to the plan JSON."
    value: ${{ steps.run.outputs.plan }}
  plan_id:
    description: "`ci plan --format github`: the plan's id."
    value: ${{ steps.run.outputs.plan_id }}
  invocations:
    description: "`ci plan --format github`: the invocations as a JSON array, usable with fromJSON."
    value: ${{ steps.run.outputs.invocations }}
  checks:
    description: "`ci plan --format github`: the selected check ids, space-separated."
    value: ${{ steps.run.outputs.checks }}
  tests:
    description: "`ci plan --format github`: how many test files are selected."
    value: ${{ steps.run.outputs.tests }}
runs:
  using: composite
  steps:
    - name: Install fairlead
      shell: bash
      env:
        FAIRLEAD_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ "$FAIRLEAD_VERSION" = "latest" ]; then base="https://github.com/mahkassem/fairlead/releases/latest/download"
        else base="https://github.com/mahkassem/fairlead/releases/download/$FAIRLEAD_VERSION"; fi
        curl -fsSL "$base/fairlead-installer.sh" | sh
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Run fairlead
      id: run
      shell: bash
      env:
        FAIRLEAD_ARGS: ${{ inputs.command }}
      # Word-split on purpose, with globbing off so `*` reaches fairlead as
      # written; the value is never re-evaluated by the shell.
      run: |
        set -f
        fairlead $FAIRLEAD_ARGS
