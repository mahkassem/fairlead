extends = ["laravel"]

# laravelio/laravel.io's tests workflow: Pest over tests/.
# With the Laravel framework pack.

[tests]
match = { replace = ["tests/**/*Test.php"] }

[[tests.runners]]
id = "php"
match = ["tests/**/*Test.php"]
command = ["vendor/bin/pest", "{files}"]

[replay]
window_days = 90
min_failures = 10

[[replay.failures]]
runner = "php"
extractor = "pest"
