# Effect-TS/effect, as its `Check` workflow runs it: one Vitest config at the
# root with a project per package, and whole-repository static checks.

[tests]
match = { replace = ["packages/**/test/**/*.test.{ts,tsx}"] }
exclude = [
  "**/dist/**",
  "**/benchmark/**",
  "**/bundle/**",
  "**/typetest/**",
  "**/test/utils/**",
  "**/test/cluster-integration/**",
]

[plan]
# Measured here before it becomes the default.
lockfile = "scope"
# Migration guides and their data, and agent-facing writing patterns: read by
# people and tools, not by tests (a file something references still counts).
ignore = ["migration/**", ".patterns/**"]

[[tests.runners]]
id = "vitest"
match = ["**"]
command = ["pnpm", "vitest", "run", "{files}"]

[[checks]]
id = "lint"
command = ["pnpm", "lint"]
paths = ["**/*.{ts,tsx,js,mjs,json,md}"]

[[checks]]
id = "circular"
command = ["pnpm", "circular"]
paths = ["packages/**/src/**"]

[[checks]]
id = "typecheck"
command = ["pnpm", "check"]
paths = ["**/*.{ts,tsx}", "**/tsconfig*.json", "**/package.json"]

[[checks]]
id = "type-tests"
command = ["pnpm", "test-types", "--target", ">=5.9"]
paths = ["**/*.{ts,tsx}", "**/tsconfig*.json"]

[[checks]]
id = "build"
command = ["pnpm", "build"]
paths = ["packages/**", "scripts/**", "tsconfig*.json"]

[[checks]]
id = "deno-check"
command = ["deno", "check", "."]
paths = ["**/*.{ts,tsx}", "**/deno.json", "**/tsconfig*.json"]

[[checks]]
id = "docgen"
command = ["pnpm", "docgen"]
paths = ["packages/**/src/**", "packages/**/docgen.json"]

[[checks]]
id = "doctest"
command = ["pnpm", "doctest"]
paths = ["packages/*/src/**/*.ts", "packages/*/*/src/**/*.ts"]

[replay]
window_days = 90
min_failures = 30
# Bundle compares build output sizes; it runs no tests or checks.
ignore = ["^Bundle$"]

[[replay.failures]]
runner = "vitest"
extractor = "vitest"
# Shard names changed over time: "Test (Node)", "Test (Node 2/4)", "Test (1/2, Node)".
job = "^Test \\(([0-9]+/[0-9]+, )?(Node|Deno|Bun)( [0-9]+/[0-9]+)?\\)$"

[[replay.checks]]
job = "^(Static|Lint)$"
step = "^(Lint|Run pnpm lint)$"
check = "lint"

[[replay.checks]]
job = "^Static$"
step = "^Check circular dependencies$"
check = "circular"

[[replay.checks]]
job = "^Types$"
step = "^Run pnpm check$"
check = "typecheck"

[[replay.checks]]
job = "^Types$"
step = "tstyche|test-types"
check = "type-tests"

[[replay.checks]]
job = "^Build$"
step = "^Run pnpm (build|check-dist-types)$"
check = "build"

[[replay.checks]]
job = "^Types on Deno$"
step = "deno check"
check = "deno-check"

[[replay.checks]]
job = "^Documentation Generation$"
step = "^Generate Documentation$"
check = "docgen"

[[replay.checks]]
# Named "Documentation Tests" in some weeks.
job = "^(Test \\(Documentation\\)|Documentation Tests)$"
step = "^Test Documentation$"
check = "doctest"

# Database tests that time out waiting on their container or engine, on pull
# requests that touch neither. Each entry applies only while the replay
# confirms it: three or more pull requests, and no failure in another job.

[[replay.quarantine]]
path = "packages/sql/mysql2/test/Persistence.test.ts"
job = "^Test \\(1/2, (Node|Deno)\\)$"
reason = "Times out after 30 s waiting on MySQL, on changes that touch neither: failed in 13 pull requests from May to July, only in the first test shard."
until = "2026-12-31"

[[replay.quarantine]]
path = "packages/sql/mysql2/test/KeyValueStore.test.ts"
job = "^Test \\(2/2, (Node|Deno)\\)$"
reason = "Its setup hook times out after 30 s waiting on MySQL: failed in 8 pull requests from May to July, only in the second test shard."
until = "2026-12-31"

[[replay.quarantine]]
path = "packages/sql/libsql/test/Resolver.test.ts"
job = "^Test \\(2/2, (Node|Deno)\\)$"
reason = "Times out after 5 s or fails to execute a statement against libSQL: failed in 3 pull requests from May to July, only in the second test shard."
until = "2026-12-31"

[[replay.quarantine]]
path = "packages/sql/d1/test/Resolver.test.ts"
job = "^Test \\((2/2, Node|Node 3/4)\\)$"
reason = "Times out after 5 s against the local D1 engine: failed in 7 pull requests from May to July, only in the Node shard that runs it."
until = "2026-12-31"
