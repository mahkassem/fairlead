# vitest-dev/vitest's CI: each suite under test/ is a workspace package run
# from its own directory, with examples and the UI package alongside. Fixture
# projects under a suite are run by that suite's tests, never directly.

[tests]
exclude = ["**/node_modules/**", "**/fixtures/**", "**/__snapshots__/**", "docs/**"]

[plan]
# Measured here before it becomes the default.
lockfile = "scope"

[[tests.runners]]
id = "playwright-ui"
match = ["test/ui/**"]
invoke = "per-module"
cwd = "{module}"
command = ["pnpm", "exec", "playwright", "test", "{files}"]

[[tests.runners]]
id = "node-test"
match = ["test/node-runner/**"]
invoke = "per-module"
cwd = "{module}"
command = ["node", "--test", "{files}"]

[[tests.runners]]
id = "vitest"
# Every suite under test/ but two, since suites come and go over a quarter.
match = ["test/**", "examples/**", "packages/**"]
exclude = ["test/ui/**", "test/node-runner/**"]
invoke = "per-module"
cwd = "{module}"
command = ["pnpm", "vitest", "run", "{files}"]

[[tests.owners]]
match = "test/{suite}/**"
# A suite's own runner config and its fixture projects' configs are loaded
# only by that suite's tests, so they select the suite, not everything.
covers = ["test/{suite}/**/fixtures/**", "test/{suite}/vitest.config.*"]
overrides_run_all = true

# Browser mode serves the built UI client (packages/browser imports @vitest/ui's
# distClientRoot), so a change to the client reaches the browser and UI specs
# through a build step, not an import.
[[tests.owners]]
match = "test/browser/**"
covers = ["packages/ui/client/**"]

[[tests.owners]]
match = "test/ui/**"
covers = ["packages/ui/client/**"]

[[checks]]
id = "lint"
command = ["pnpm", "run", "lint"]
paths = ["**/*.{ts,tsx,js,mjs,cjs,vue,json,md}"]

[[checks]]
id = "typecheck"
command = ["pnpm", "run", "typecheck"]
paths = ["**/*.{ts,tsx,vue}", "**/tsconfig*.json", "**/package.json"]

[[checks]]
id = "build"
command = ["pnpm", "run", "build"]
paths = ["packages/**", "scripts/**", "*.{ts,mjs,json}"]

[replay]
window_days = 90
min_failures = 30
# The changed-files probe, the browser image build and the report merge, not tests.
ignore = ["^Diff: ", "^Image: ", "^Merge Reports$"]
# A job that failed only while installing never ran a test.
ignore_steps = ["^Install$"]

[[replay.quarantine]]
path = "test/typescript/test/typechecker.test.ts"
job = "^Test: unit, node-24, windows-latest$"
reason = "Fails only on the Windows unit job (its out-of-memory crash and missing-command cases): 60 failures across 36 pull requests from June to August 2026, while the same job passed 356 times and no other job ever failed it."
until = "2026-12-31"

[[replay.failures]]
runner = "vitest"
extractor = "vitest"
# Older runs named the test jobs "Build&Test:", "Cache&Test:" and so on.
job = "^(Test|Browsers|[A-Za-z]+&Test): "

[[replay.checks]]
job = "^Lint: "
step = "^Lint$"
check = "lint"

[[replay.checks]]
job = "^Lint: "
step = "^Typecheck( UI)?$"
check = "typecheck"

[[replay.checks]]
job = "^Lint: "
step = "^Build$"
check = "build"
