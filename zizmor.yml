# release.yml is generated by dist and must not be hand-edited; these are
# its known findings, ignored for the whole file since regeneration moves lines.
rules:
  excessive-permissions:
    ignore: [release.yml]
  template-injection:
    ignore: [release.yml]
  secrets-inherit:
    ignore: [release.yml]
  unpinned-images:
    ignore: [release.yml]
  # install-smoke.yml runs on the release workflow's completion because dist
  # creates releases with the workflow token, which starts no `release` event.
  # It checks nothing out, holds no permissions and checks the tag's shape.
  dangerous-triggers:
    ignore: [install-smoke.yml]
