# Installs a released tag through each installer on each OS and checks the
# version it prints. Runs when the release workflow finishes a tag, or by hand
# for any tag. The release is created with the workflow token, which starts no
# `release` event, hence `workflow_run`. Publishing to npm, crates.io and the
# Homebrew tap waits for an approval, so those legs wait for the package too.
# The Alpine leg installs on musl. The Composer legs install the tag's own
# launcher from a path repository, so they test the launcher against the
# release before Packagist lists it.
name: install-smoke

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to install, such as v0.1.1
        required: true

permissions: {}

jobs:
  install:
    name: ${{ matrix.installer }} (${{ matrix.container && 'alpine' || matrix.os }})
    # A tag push that released, not the release workflow's pull request plan.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, installer: shell }
          - { os: macos-latest, installer: shell }
          - { os: windows-latest, installer: powershell }
          - { os: ubuntu-24.04, installer: npm }
          - { os: macos-latest, installer: npm }
          - { os: windows-latest, installer: npm }
          - { os: ubuntu-24.04, installer: cargo }
          - { os: macos-latest, installer: brew }
          - os: ubuntu-24.04
            installer: npm
            container: node:24-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
          - { os: ubuntu-24.04, installer: composer }
          - { os: macos-latest, installer: composer }
          - { os: windows-latest, installer: composer }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 75
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
      BASE: https://github.com/mahkassem/fairlead/releases/download
    steps:
      - name: Install bash in the Alpine container
        if: matrix.container
        shell: sh
        run: apk add --no-cache bash
      - name: Check the tag
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a release tag: $TAG"; exit 1; }
      - name: Install with the shell installer
        if: matrix.installer == 'shell'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf "$BASE/$TAG/fairlead-installer.sh" | sh
          "${CARGO_HOME:-$HOME/.cargo}/bin/fairlead" --version | tee version.txt
      - name: Install with the PowerShell installer
        if: matrix.installer == 'powershell'
        shell: pwsh
        run: |
          Invoke-RestMethod "$env:BASE/$env:TAG/fairlead-installer.ps1" | Invoke-Expression
          $cargo = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          & (Join-Path $cargo 'bin\fairlead.exe') --version | Tee-Object -FilePath version.txt
      - name: Install from npm
        if: matrix.installer == 'npm'
        shell: bash
        run: |
          version="${TAG#v}"
          if [[ "$version" == *-* ]]; then
            echo "prereleases aren't published to npm"
            echo "fairlead $version" > version.txt
            exit 0
          fi
          for _ in $(seq 60); do
            npm view "fairlead@$version" version >/dev/null 2>&1 && break
            echo "fairlead@$version isn't on npm yet; waiting for the publish approval"
            sleep 60
          done
          npx --yes "fairlead@$version" --version | tee version.txt
      - name: Install from crates.io
        if: matrix.installer == 'cargo'
        shell: bash
        run: |
          version="${TAG#v}"
          if [[ "$version" == *-* ]]; then
            echo "prereleases aren't published to crates.io"
            echo "fairlead $version" > version.txt
            exit 0
          fi
          for _ in $(seq 60); do
            curl -fsS https://index.crates.io/fa/ir/fairlead | grep -qF "\"vers\":\"$version\"" && break
            echo "fairlead $version isn't on crates.io yet; waiting for the publish approval"
            sleep 60
          done
          cargo install fairlead --version "$version" --locked
          "${CARGO_HOME:-$HOME/.cargo}/bin/fairlead" --version | tee version.txt
      - name: Install from the Homebrew tap
        if: matrix.installer == 'brew'
        shell: bash
        run: |
          version="${TAG#v}"
          if [[ "$version" == *-* ]]; then
            echo "prereleases aren't published to the tap"
            echo "fairlead $version" > version.txt
            exit 0
          fi
          for _ in $(seq 60); do
            curl -fsS https://raw.githubusercontent.com/mahkassem/homebrew-tap/HEAD/Formula/fairlead.rb | grep -qF "version \"$version\"" && break
            echo "fairlead $version isn't in the tap yet; waiting for the publish approval"
            sleep 60
          done
          brew install mahkassem/tap/fairlead
          "$(brew --prefix)/bin/fairlead" --version | tee version.txt
      - name: Check out the tag's launcher
        if: matrix.installer == 'composer'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          path: fairlead-src
          persist-credentials: false
      - name: Install with Composer
        if: matrix.installer == 'composer'
        shell: bash
        run: |
          command -v php >/dev/null || brew install php composer
          version="${TAG#v}"
          mkdir smoke && cd smoke
          # Relative, so Windows PHP never sees a bash-style /d/... path.
          src=../fairlead-src
          # The path repository gives the package the tag's version, as Packagist would.
          php -r '$v = $argv[1]; $src = $argv[2]; file_put_contents("composer.json", json_encode(["repositories" => [["type" => "path", "url" => $src, "options" => ["symlink" => false, "versions" => ["mahkassem/fairlead" => $v]]]], "require-dev" => ["mahkassem/fairlead" => $v]], JSON_UNESCAPED_SLASHES));' "$version" "$src"
          composer install --no-interaction --no-progress
          php vendor/bin/fairlead --version | tee ../version.txt
      - name: The installed binary prints the tag's version
        shell: bash
        run: |
          version="${TAG#v}"
          grep -qxF "fairlead $version" <(tr -d '\r' < version.txt) || { echo "expected fairlead $version"; exit 1; }
