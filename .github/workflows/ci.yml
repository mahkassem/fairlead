name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # No debug info in CI's dev and test builds: nothing reads it, and the linker writes less without it.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # `os` names the required checks, so it keeps its value; `runner` pins
        # the image, so a label moving to a new release can't change CI unseen.
        include:
          - { os: ubuntu-latest, runner: ubuntu-24.04 }
          - { os: macos-latest, runner: macos-latest }
          - { os: windows-latest, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The release build and its budgets, beside the tests rather than after them: fat LTO is
  # the slowest step of the run, and it doesn't need the tests' result.
  release:
    name: release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, runner: ubuntu-24.04 }
          - { os: macos-latest, runner: macos-latest }
          - { os: windows-latest, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Release binary stays within its size budget
        shell: bash
        run: |
          cargo build --release
          bin=target/release/fairlead; [ -f "$bin.exe" ] && bin="$bin.exe"
          size=$(wc -c < "$bin")
          echo "release binary: $size bytes"
          [ "$size" -le 20971520 ] || { echo "over the 20 MB budget"; exit 1; }
      - name: Graph build stays within its time budget
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release -p fairlead-lang --test perf -- --ignored --nocapture
      - name: Write hook stays within its time budget
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release -p fairlead --test hook_perf -- --ignored --nocapture

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The workspace builds with the rust-version it declares
        shell: bash
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          [ -n "$msrv" ] || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "declared rust-version: $msrv"
          rustup toolchain install "$msrv" --profile minimal
          RUSTUP_TOOLCHAIN="$msrv" cargo check --workspace --all-targets --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  leak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: node --test 'npm/*.test.js'
      # The Composer launcher's tests; the runner image ships PHP.
      - run: php tests-php/run.php
      - run: python3 scripts/leak_check.py
      - run: python3 scripts/docs_check.py

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: mdbook
      - run: mdbook build docs

  zizmor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: zizmor@1.30.1
      - run: zizmor --offline --min-severity medium --min-confidence medium .

  dist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: release.yml is exactly what dist generates
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
          dist generate --check
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95.0"
      # Builds each crate from its package against its siblings' packages
      # (cargo stands a local registry in for the unpublished ones), so a file
      # left out of a crate or a broken pin fails here rather than mid-release.
      # About three minutes cold, beside jobs that take longer.
      - name: Every crate packages and builds as crates.io will see it
        run: cargo publish --workspace --dry-run --locked
