# Called by release.yml (dist's custom publish job). The `release`
# environment requires a reviewer. npm trusted publishing checks the calling
# workflow, so npm's trust config names release.yml and this environment.
name: publish-npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
      # Trusted publishing needs npm 11.5.1 or later.
      NPM_VERSION: "11.20.0"
    steps:
      - name: Fetch npm packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true
      # dist's installer races two first runs on the binary (#211) and fails
      # the install on a platform with no build (#218); swap in ours, which
      # stops here if dist's files aren't the ones they were ported from.
      # Fetched without a token: release.yml grants this job only id-token.
      - name: Fetch Fairlead's installer
        run: |
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          mkdir -p src/scripts src/npm
          curl -fsSL --retry 3 -o src/scripts/npm_patch.py "$base/scripts/npm_patch.py"
          curl -fsSL --retry 3 -o src/npm/binary-install.js "$base/npm/binary-install.js"
          curl -fsSL --retry 3 -o src/npm/binary.js "$base/npm/binary.js"
      - run: python3 src/scripts/npm_patch.py npm/*-npm-package.tar.gz
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
      - run: npm install --global "npm@${NPM_VERSION}"
      - run: |
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq '.artifacts[] | select(endswith("-npm-package.tar.gz"))' --raw-output)
            npm publish --access public "./npm/${pkg}"
          done
