# Called by release.yml (dist's custom publish job). The `release`
# environment requires a reviewer, and npm trusted publishing trusts only
# this workflow in that environment, so there is no npm token to leak.
name: publish-npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
      # Trusted publishing needs npm 11.5.1 or later.
      NPM_VERSION: "11.20.0"
    steps:
      - name: Fetch npm packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm install --global "npm@${NPM_VERSION}"
      - run: |
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq '.artifacts[] | select(endswith("-npm-package.tar.gz"))' --raw-output)
            npm publish --access public "./npm/${pkg}"
          done
