# Called by release.yml (dist's custom plan job): every build waits for it, so
# a tag whose README, site or book lags the release it cuts builds nothing.
# On a pull request it runs the checks every change keeps.
name: docs-check

on:
  workflow_call:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The docs describe the release
        run: python3 scripts/docs_check.py
