# Called by release.yml (dist's custom publish job). The `release`
# environment requires a reviewer. crates.io trusted publishing checks the
# calling workflow, so each crate's trusted publisher names release.yml and
# this environment, and there is no crates.io token to leak.
name: publish-crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      id-token: write
    env:
      # Dependencies before their dependents: each must be in the index before
      # the next crate can resolve it.
      CRATES: fairlead-core fairlead-lang fairlead-tests fairlead-guard fairlead-replay fairlead
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95.0"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish each crate not yet in the index
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "fairlead") | .version')
          # The sparse index lists one JSON line per published version.
          published() {
            local name=$1 path body
            path="${name:0:2}/${name:2:2}/${name}"
            body=$(curl -sS --retry 3 -w '\n%{http_code}' "https://index.crates.io/${path}")
            case "${body##*$'\n'}" in
              200) printf '%s\n' "${body%$'\n'*}" | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null ;;
              404) return 1 ;;
              *) echo "index answered ${body##*$'\n'} for ${name}"; exit 1 ;;
            esac
          }
          for crate in $CRATES; do
            # A re-run after a half-finished publish skips what already went out.
            if published "$crate"; then
              echo "${crate} ${version} is already on crates.io"
              continue
            fi
            cargo publish --locked -p "$crate"
            for _ in $(seq 30); do
              published "$crate" && break
              echo "waiting for ${crate} ${version} to reach the index"
              sleep 10
            done
            published "$crate" || { echo "${crate} ${version} never reached the index"; exit 1; }
          done
