[package]
name = "fairlead-replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Replay of failed CI runs for Fairlead: fetch, extract, attribute and report."
publish = false

[dependencies]
fairlead-core = { version = "0.3.0", path = "../fairlead-core" }
fairlead-lang = { version = "0.3.0", path = "../fairlead-lang" }
fairlead-tests = { version = "0.3.0", path = "../fairlead-tests" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
toml = "1.1.6"
