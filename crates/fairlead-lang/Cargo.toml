[package]
name = "fairlead-lang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Source scanning and import resolution for Fairlead."
publish = false

[dependencies]
fairlead-core = { version = "0.2.0", path = "../fairlead-core" }
globset = "0.4"
ignore = "0.4"
oxc_resolver = "11.23"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1.0.151"
sha1_smol = "1"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
