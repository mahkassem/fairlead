[package]
name = "fairlead-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Test selection for Fairlead: modules, test files, owner rules and the plan."
readme = "README.md"

[dependencies]
fairlead-core = { version = "=0.13.0", path = "../fairlead-core" }
fairlead-lang = { version = "=0.13.0", path = "../fairlead-lang" }
globset = "0.4"
regex = "1"
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.151"
sha2 = "0.11"

[dev-dependencies]
toml = "1.1.6"
