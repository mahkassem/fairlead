# Generated by `fairlead ci workflow` from the Fairlead config.
# Change the config and run `fairlead ci workflow --write` again rather
# than editing this file, which that command replaces.
name: fairlead

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  push:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: read   # each job widens only what it needs

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read   # the history the plan diffs
      actions: read    # past runs, for --since-green
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      run_unit: ${{ steps.plan.outputs.run_unit }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
      run_desktop_build: ${{ steps.plan.outputs.run_desktop_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install fairlead
        uses: mahkassem/fairlead@3a251540c5c8bfec080a5bdd953d4030ba5f3c26 # v0.7.1
        with:
          version: vX.Y.Z
          command: --version
      - name: Plan
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(ci plan --format github --out "$RUNNER_TEMP/fairlead-plan.json")
          args+=(--since-green e2e --since-green desktop-build)
          if [ -n "$BASE" ]; then args+=(--base "$BASE"); fi
          fairlead "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fairlead-plan
          path: ${{ runner.temp }}/fairlead-plan.json
          if-no-files-found: error

  checks:
    name: checks
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read   # check out the code the plan names
    concurrency:
      group: ${{ github.workflow }}-checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fairlead
        uses: mahkassem/fairlead@3a251540c5c8bfec080a5bdd953d4030ba5f3c26 # v0.7.1
        with:
          version: vX.Y.Z
          command: --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fairlead-plan
          path: ${{ runner.temp }}
      - name: Run
        run: |
          fairlead ci run --plan "$RUNNER_TEMP/fairlead-plan.json" --except e2e --except desktop-build

  e2e:
    name: e2e
    needs: plan
    if: needs.plan.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # check out the code the plan names
    concurrency:
      group: ${{ github.workflow }}-e2e-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fairlead
        uses: mahkassem/fairlead@3a251540c5c8bfec080a5bdd953d4030ba5f3c26 # v0.7.1
        with:
          version: vX.Y.Z
          command: --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fairlead-plan
          path: ${{ runner.temp }}
      - name: Run
        run: |
          fairlead ci run --plan "$RUNNER_TEMP/fairlead-plan.json" --only e2e

  desktop-build:
    name: desktop-build
    needs: plan
    if: needs.plan.outputs.run_desktop_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # check out the code the plan names
    concurrency:
      group: ${{ github.workflow }}-desktop-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fairlead
        uses: mahkassem/fairlead@3a251540c5c8bfec080a5bdd953d4030ba5f3c26 # v0.7.1
        with:
          version: vX.Y.Z
          command: --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fairlead-plan
          path: ${{ runner.temp }}
      - name: Run
        run: |
          fairlead ci run --plan "$RUNNER_TEMP/fairlead-plan.json" --only desktop-build
