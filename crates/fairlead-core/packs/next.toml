# Next.js: what its file conventions tie together that no import shows.
# The App Router wraps each route in the layouts, templates, loading and
# error boundaries of every folder above it, and the Pages Router wraps each
# page in _app and _document. `app/` and `src/app/` are both read. What an
# end-to-end spec reaches over HTTP is the `next-e2e` pack's, since it ties
# every spec to every route and would undo end-to-end owner rules.

[plan]
# The config changes how every file builds.
run_all = ["next.config.{js,mjs,cjs,ts}"]

# A route under the root layout and the boundaries beside it.
[[graph.edges]]
from = "{src/,}app/**/{page,route,default}.{js,jsx,ts,tsx}"
to = ["{src/,}app/{layout,template,loading,error,not-found}.{js,jsx,ts,tsx}", "{src/,}app/global-error.{js,jsx,ts,tsx}"]

# The same for each folder above a route, one rule per depth, since a name
# in a rule stands for one folder.
[[graph.edges]]
from = "{src/,}app/{a}/**/{page,route,default}.{js,jsx,ts,tsx}"
to = ["{src/,}app/{a}/{layout,template,loading,error,not-found}.{js,jsx,ts,tsx}"]

[[graph.edges]]
from = "{src/,}app/{a}/{b}/**/{page,route,default}.{js,jsx,ts,tsx}"
to = ["{src/,}app/{a}/{b}/{layout,template,loading,error,not-found}.{js,jsx,ts,tsx}"]

[[graph.edges]]
from = "{src/,}app/{a}/{b}/{c}/**/{page,route,default}.{js,jsx,ts,tsx}"
to = ["{src/,}app/{a}/{b}/{c}/{layout,template,loading,error,not-found}.{js,jsx,ts,tsx}"]

[[graph.edges]]
from = "{src/,}app/{a}/{b}/{c}/{d}/**/{page,route,default}.{js,jsx,ts,tsx}"
to = ["{src/,}app/{a}/{b}/{c}/{d}/{layout,template,loading,error,not-found}.{js,jsx,ts,tsx}"]

[[graph.edges]]
from = "{src/,}app/{a}/{b}/{c}/{d}/{e}/**/{page,route,default}.{js,jsx,ts,tsx}"
to = ["{src/,}app/{a}/{b}/{c}/{d}/{e}/{layout,template,loading,error,not-found}.{js,jsx,ts,tsx}"]

# The Pages Router wraps every page in _app and _document.
[[graph.edges]]
from = "{src/,}pages/**/*.{js,jsx,ts,tsx}"
to = ["{src/,}pages/_app.{js,jsx,ts,tsx}", "{src/,}pages/_document.{js,jsx,ts,tsx}"]
